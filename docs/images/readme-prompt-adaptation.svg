<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">为 DSH 适配的系统级执行优化</title><desc id="desc">成熟的执行结构按 DSH 的工具、权限和执行模式适配，装配主提示词、工具说明和动态提醒。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7093c3" stroke-width="1.3"/></marker></defs><rect width="1200" height="420" rx="16" fill="#f4f7fb"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="52" y="53" font-size="12" fill="#587ba9" letter-spacing="2">SYSTEM-LEVEL ADAPTATION</text><text x="52" y="92" font-size="28" font-weight="600" fill="#1c3557">把成熟的执行结构，接入 DSH 的真实能力。</text><rect x="52" y="133" width="306" height="106" rx="12" fill="#fff" stroke="#dce4ef"/><text x="74" y="171" font-size="21" font-weight="600" fill="#203c62">执行结构</text><text x="74" y="203" font-size="15" fill="#71839c">理解要求 · 持续行动 · 核对交付</text><rect x="446" y="133" width="326" height="106" rx="12" fill="#edf3fe" stroke="#b8cdee"/><text x="468" y="171" font-size="21" font-weight="600" fill="#203c62">DSH 能力适配</text><text x="468" y="203" font-size="15" fill="#71839c">真实工具 · 原生权限 · 执行模式</text><rect x="860" y="133" width="288" height="106" rx="12" fill="#fff" stroke="#dce4ef"/><text x="882" y="171" font-size="21" font-weight="600" fill="#203c62">按当前环境装配</text><text x="882" y="203" font-size="15" fill="#71839c">主提示词 · 工具说明 · 动态提醒</text><path d="M358 186H438" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M772 186H852" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M52 288H1148" stroke="#d6e1ee"/><text x="52" y="332" font-size="18" font-weight="600" fill="#365880">沿用原生工具循环</text><text x="418" y="332" font-size="18" font-weight="600" fill="#365880">保留宿主真实接口</text><text x="826" y="332" font-size="18" font-weight="600" fill="#365880">随能力调整装配</text><text x="52" y="389" font-size="14" fill="#8290a4">系统提示词适配与输入框草稿优化分别发挥作用。图示为架构说明。</text></g></svg>