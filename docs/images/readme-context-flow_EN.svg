<rect x="300" y="364" width="700" height="62" rx="10" fill="#f7f9fc" stroke="#dce2eb"/>
<text x="322" y="401" font-size="18" font-weight="600" fill="#17243a">Source archive</text><text x="502" y="401" font-size="17" fill="#5b687b">Keep text &amp; attachments · recall by source</text>
<path d="M867 364V347" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M40 450H1000" stroke="#dce2eb"/>
<text x="40" y="474" font-size="16" fill="#5b687b"><tspan font-weight="600" fill="#17243a">Dream runs separately</tspan>　Only shared sessions → project → global short memory.</text>
<text x="40" y="497" font-size="14" fill="#5b687b">Private Chat and descendants outside real workspaces stay isolated. Context preparation remains separate.</text>
