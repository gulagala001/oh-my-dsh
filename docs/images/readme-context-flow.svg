<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">可追溯的上下文与记忆</title><desc id="desc">对话在后台整理成摘要与详细资料，当前工作按需使用；原始材料存档并可回查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7093c3" stroke-width="1.3"/></marker></defs><rect width="1200" height="440" rx="16" fill="#f4f7fb"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="52" y="53" font-size="12" fill="#587ba9" letter-spacing="2">CONTEXT &amp; MEMORY</text><text x="52" y="92" font-size="28" font-weight="600" fill="#1c3557">让工作上下文变轻，让精确细节有出处。</text><rect x="52" y="127" width="242" height="102" rx="12" fill="#fff" stroke="#dce4ef"/><text x="74" y="165" font-size="21" font-weight="600" fill="#203c62">持续对话</text><text x="74" y="197" font-size="15" fill="#71839c">用户要求 · 工具往返</text><rect x="398" y="127" width="340" height="102" rx="12" fill="#edf3fe" stroke="#b8cdee"/><text x="420" y="165" font-size="21" font-weight="600" fill="#203c62">异步智能整理</text><text x="420" y="197" font-size="15" fill="#71839c">事实摘要 · 详细资料 · 表示选择</text><rect x="842" y="127" width="306" height="102" rx="12" fill="#fff" stroke="#dce4ef"/><text x="864" y="165" font-size="21" font-weight="600" fill="#203c62">当前工作上下文</text><text x="864" y="197" font-size="15" fill="#71839c">按需替换，在请求边界应用</text><path d="M294 178H390" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M738 178H834" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="398" y="281" width="340" height="96" rx="12" fill="#edf3fe" stroke="#b8cdee"/><text x="420" y="319" font-size="21" font-weight="600" fill="#203c62">原始材料存档</text><text x="420" y="351" font-size="15" fill="#71839c">原话 · 文档 · 图片 · 附件</text><path d="M174 229V329H390" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M738 329H997V237" fill="none" stroke="#7093c3" stroke-width="1.7" marker-end="url(#arrow)"/><text x="64" y="283" font-size="14" fill="#71839c">保存原始材料</text><text x="850" y="311" font-size="14" fill="#5279ac">回查细节与原件</text><text x="52" y="414" font-size="14" fill="#8290a4">摘要用于继续工作，原始材料用于核对细节。图示解释机制，不表示容量或压缩速度指标。</text></g></svg>