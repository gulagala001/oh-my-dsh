<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenCU Browser Access</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui,sans-serif; }
    body { margin: 0; color: CanvasText; background: Canvas; }
    main { max-width: 560px; margin: 64px auto; padding: 0 24px; }
    header { font-weight: 600; color: #287bc1; padding-bottom: 20px; border-bottom: 1px solid #8886; }
    h1 { font-size: 22px; margin: 24px 0 12px; }
    p { margin: 12px 0; overflow-wrap: anywhere; }
    ul { padding-left: 22px; }
    li { margin: 10px 0; }
    #identity { font-size: 12px; opacity: .7; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 12px; margin: 24px 0; }
    button { min-height: 36px; padding: 6px 16px; border: 1px solid #8889; border-radius: 4px; font: inherit; cursor: pointer; }
    #confirm { background: #1670be; border-color: #1670be; color: white; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 42px; }
    @media (max-width: 600px) { main { margin-top: 28px; } }
  </style>
  <script type="module" src="profile-permissions.js"></script>
</head>
<body>
  <main>
    <header>OpenCU</header>
    <h1 id="title">浏览器权限</h1>
    <p id="description">正在读取此浏览器中的请求。</p>
    <ul id="permissions"></ul>
    <p id="identity"></p>
    <div class="actions">
      <button id="confirm" type="button" disabled>继续</button>
      <button id="close" type="button">关闭</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
