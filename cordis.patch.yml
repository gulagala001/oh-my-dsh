- insert:
    - id: trisoul-x
      name: trisoul_x

- id: agent-preset-registry
  config:
    default: trisoul-x

- id: system-prompt
  config:
    includeHarnessIdentity: false

- id: fs-observation-policy
  disabled: true

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

# DSH 0.1.7-rc.2 providers with opt-in OMD extensions. Original rows remain
# intact and become active again when this bundle is removed.
- id: tools
  disabled: true
- id: jobs
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- insert:
    - id: omd-tools
      name: trisoul_x/host/tools
    - id: omd-jobs
      name: trisoul_x/host/jobs-local
    - id: omd-bash-sandbox
      name: trisoul_x/host/bash-sandbox
      disabled: !!js process.platform === 'win32'
    - id: omd-pwsh-sandbox
      name: trisoul_x/host/pwsh-sandbox
      disabled: !!js process.platform !== 'win32'

- id: ui-conversation
  disabled: true

- id: ui-chat
  disabled: true

- insert:
    - id: omd-ui-conversation
      name: trisoul_x/host/ui-conversation
    - id: omd-ui-chat
      name: trisoul_x/host/ui-chat
