name: Stock desktop diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ci/stock-desktop-diagnostic]

permissions:
  contents: read
  actions: read

concurrency:
  group: stock-desktop-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44537840705
          name: stock-desktop-plugin
          path: ${{ runner.temp }}/omd-stock-package
      - name: Install the fixture dependencies
        shell: pwsh
        run: |
          $dependencies = Join-Path $env:RUNNER_TEMP 'omd-stock-test-deps'
          npm install --prefix $dependencies --no-audit --no-fund playwright@1.63.0 sharp@0.35.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OMD_STOCK_TEST_DEPENDENCIES=$dependencies" >> $env:GITHUB_ENV
      - name: Download the signed official DSH desktop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-rc3-official.exe'
          curl.exe --fail --location --retry 3 --silent --show-error 'https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.2-rc.3-win-x64.exe' -o $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'DeepSeek') {
            throw "The official DSH installer signature is invalid: $($signature.Status)"
          }
      - name: Exercise OMD on the unmodified DSH application
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'omd-stock-package') -Filter '*.tgz' -File)
          if ($archives.Count -ne 1) { throw 'Expected one plugin package' }
          ./test/fixtures/stock-desktop/check-installed.ps1 -Installer (Join-Path $env:RUNNER_TEMP 'dsh-rc3-official.exe') -Archive $archives[0].FullName
      - name: Verify Workbench profile restart and download bytes
        if: success() || failure()
        run: node test/fixtures/stock-desktop/check-workbench.mjs
