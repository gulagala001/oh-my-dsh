name: Stock desktop compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 16
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Playwright fixture dependencies
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'issue-94-deps'
          npm install --prefix $deps --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OMD_STOCK_TEST_DEPENDENCIES=$deps" >> $env:GITHUB_ENV
      - name: Verify the release on signed Windows rc.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'oh-my-dsh-0.2.2-rc.5.omd.1.9.3.tgz'
          gh release download v0.2.2-rc.5.omd.1.9.3 --repo gulagala001/oh-my-dsh --pattern 'oh-my-dsh-*.tgz' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd7d99599fdb3b5cc0ce0aa84edad2c34da4ca7dd23d59e1978b23cd718f4b9cc') { throw 'Package digest mismatch' }
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-rc5-official.exe'
          curl.exe --fail --location --retry 3 --silent --show-error 'https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.2-rc.5-win-x64.exe' -o $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'DeepSeek') { throw 'Unexpected installer signature' }
          ./test/fixtures/stock-desktop/check-installed.ps1 -Installer $installer -Archive $archive
