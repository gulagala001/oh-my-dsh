name: Publish verified OMD release
on:
  push:
    branches: ['release/alpha2-verified']
    paths: ['.github/workflows/publish-verified.yml']
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          repository: gulagala001/opencu
          ref: 93a8a2e95d2b3874ef393f634fb17aae9e5ab57f
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 9134af4d988ed0b0a75b01a429fcdfd886abe062
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
      - name: Retire only a superseded incomplete OMD check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          repo='gulagala001/oh-my-dsh';expected='9134af4d988ed0b0a75b01a429fcdfd886abe062';old='4534a0a2af3da8f8b21d444ffdcb325c4227830a'
          def get(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          assert get('branches/main')['commit']['sha']==expected
          for run in get('actions/runs?head_sha='+old+'&per_page=100')['workflow_runs']:
              if run['head_sha']==old and run['head_branch']=='main' and run['name']=='CI' and run['event']=='push' and run['status'] in ['queued','pending','in_progress']:
                  subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/runs/'+str(run['id'])+'/cancel'],check=True)
                  print('Superseded incomplete check cancelled:',run['id'])
          PY
      - name: Validate all final checks, install the actual package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/source
          SOURCE_REPOSITORY: gulagala001/oh-my-dsh
          SOURCE_SHA: 9134af4d988ed0b0a75b01a429fcdfd886abe062
          RELEASE_TAG: v0.1.6-alpha.2.1
          REQUIRED_CHECKS: '[{"repo":"gulagala001/oh-my-dsh","sha":"9134af4d988ed0b0a75b01a429fcdfd886abe062","workflow":"CI"},{"repo":"gulagala001/oh-my-dsh","sha":"9134af4d988ed0b0a75b01a429fcdfd886abe062","workflow":"Host compatibility"},{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"CI"},{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"Windows Computer Use"},{"repo":"gulagala001/opencu","sha":"13813e9269e3b7c87778fd1aa937fc47ff0e2349","workflow":"Browser compatibility"}]'
        run: python control/.github/release/publish_verified.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oh-my-dsh-v0.1.6-alpha.2.1-release
          path: release-assets/
          retention-days: 14
