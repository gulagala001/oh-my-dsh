name: rc2 selected-session conversation hot installation

on:
  pull_request:
    paths:
      - '.github/workflows/conversation-hot-install.yml'
      - 'test/conversation-controller-readiness.test.mjs'
      - 'test/desktop-conversation-hot-install*.test.mjs'
      - 'test/fixtures/conversation-hot-install/**'
      - 'vendor/dsh/**'
      - 'vendor/dsh.json'
      - 'lib/client.js'
      - 'lib/host/ui-conversation.factory.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-hot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node --test test/conversation-controller-readiness.test.mjs test/desktop-conversation-hot-install-contract.test.mjs
  selected-session-hot-install:
    needs: lifecycle-contract
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify rebuilt candidate matches tracked artifacts
        run: git diff --exit-code -- lib/client.js lib/host/ui-conversation.factory.mjs vendor/dsh.json
      - name: Reserve exclusive inputs
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, mkdirSync, mkdtempSync, realpathSync } from 'node:fs';
          import { join } from 'node:path';
          const repo = realpathSync(process.env.GITHUB_WORKSPACE);
          mkdirSync(join(repo, '.cache'), { recursive: true });
          const root = mkdtempSync(join(repo, '.cache', 'conversation-hot-'));
          appendFileSync(process.env.GITHUB_ENV, `OMD_DESKTOP_TEST_ROOT=${root}\n`);
          NODE
      - run: node scripts/prepare-desktop-test.mjs mac-arm64
      - name: Freeze actual final candidate
        run: |
          npm pack --json --ignore-scripts --pack-destination "$OMD_DESKTOP_TEST_ROOT" > "$OMD_DESKTOP_TEST_ROOT/pack.json"
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          import { nativePackageModes } from './scripts/native-package-modes.mjs';
          const root = process.env.OMD_DESKTOP_TEST_ROOT;
          const rows = JSON.parse(readFileSync(join(root, 'pack.json')));
          if (rows.length !== 1) throw Error('One final archive required');
          const archive = realpathSync(join(root, rows[0].filename));
          await nativePackageModes(archive);
          const appRoot = realpathSync(join(root, 'mac-app', 'DeepSeek Harness.app', 'Contents', 'Resources', 'app.asar'));
          const sha256 = createHash('sha256').update(readFileSync(archive)).digest('hex');
          writeFileSync(join(root, 'candidate-digests.json'), JSON.stringify({ sha256,
            sourceCommit: process.env.GITHUB_SHA, version: JSON.parse(readFileSync('package.json')).version }, null, 2));
          appendFileSync(process.env.GITHUB_ENV, `OMD_DESKTOP_APP_ROOT=${appRoot}\nOMD_PLUGIN_ARCHIVE=${archive}\nOMD_PLUGIN_ARCHIVE_SHA256=${sha256}\n`);
          NODE
      - name: Observe already-selected blank session through real hot installation
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/desktop-conversation-hot-install.test.mjs | tee "$OMD_DESKTOP_TEST_ROOT/conversation-hot.tap"
          node test/fixtures/conversation-hot-install/contract.mjs "$OMD_DESKTOP_TEST_ROOT/conversation-hot-evidence/conversation-hot-install.json" "$OMD_DESKTOP_TEST_ROOT/conversation-hot.tap"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc2-selected-session-conversation-hot-install
          path: |
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/candidate-digests.json
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/pack.json
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/conversation-hot.tap
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/conversation-hot-evidence/
          if-no-files-found: warn
