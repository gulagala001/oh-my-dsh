name: rc2 selected-session conversation hot installation

on:
  pull_request:
    paths:
      - '.github/workflows/conversation-hot-install.yml'
      - 'test/conversation-controller-readiness.test.mjs'
      - 'test/desktop-conversation-hot-install-contract.test.mjs'
      - 'test/fixtures/conversation-hot-install/**'
      - 'vendor/dsh/**'
      - 'vendor/dsh.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-hot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node --test test/conversation-controller-readiness.test.mjs test/desktop-conversation-hot-install-contract.test.mjs
