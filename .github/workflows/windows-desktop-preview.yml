name: Windows desktop preview

on:
  push:
    branches: [release/windows-desktop-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: node scripts/prepare-host-sdk.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm run prepack
      - name: Verify the plugin archive
        run: |
          mkdir -p "$RUNNER_TEMP/omd"
          OMD_NPM_ENTRY="$(npm root -g)/npm/bin/npm-cli.js" node scripts/pack-local.mjs "$RUNNER_TEMP/omd"
      - uses: actions/upload-artifact@v7
        with:
          name: omd-plugin-build-input
          path: ${{ runner.temp }}/omd/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: omd
    runs-on: windows-2025
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_FAIL_FAST: '1'
      PACKAGE_WINDOWS_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: omd-plugin-build-input
          path: ${{ runner.temp }}/omd
      - name: Prepare the pinned desktop source
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          $base = Join-Path $env:RUNNER_TEMP 'dsh-base'
          $source = Join-Path $env:RUNNER_TEMP 'omd-desktop'
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $target = $manifest.devDependencies.'@deepseek-ai/dsh'
          $plugin = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'omd') -Filter '*.tgz' -File)
          if ($plugin.Count -ne 1) { throw 'Expected one verified OMD package' }
          git clone --depth 1 --branch "dsh-v$target" https://github.com/deepseek-ai/deepseek-harness.git $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-desktop-source.mjs $base $plugin[0].FullName $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OMD_DESKTOP_SOURCE=$source" >> $env:GITHUB_ENV
          "OMD_DESKTOP_VERSION=$($manifest.version).preview.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' /t REG_DWORD /f /v 'AllowDevelopmentWithoutDevLicense' /d '1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the unsigned Windows installer
        run: |
          Set-Location $env:OMD_DESKTOP_SOURCE
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run package:desktop:win:x64 --unsigned --build-version $env:OMD_DESKTOP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify install, first launch, embedded browser and uninstall
        run: |
          $directory = Join-Path $env:OMD_DESKTOP_SOURCE 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installers = @(Get-ChildItem $directory -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          ./test/fixtures/windows-desktop-preview/check-installed.ps1 -Installer $installers[0].FullName
          $output = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'omd-preview')
          $name = "oh-my-dsh-$env:OMD_DESKTOP_VERSION-win-x64-setup.exe"
          $file = Join-Path $output.FullName $name
          Copy-Item -LiteralPath $installers[0].FullName -Destination $file
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content -Encoding ascii (Join-Path $output.FullName 'SHA256SUMS')
      - uses: actions/upload-artifact@v7
        with:
          name: omd-windows-x64-preview
          path: ${{ runner.temp }}/omd-preview/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure() && env.OMD_DESKTOP_SOURCE != ''
        with:
          name: windows-packaging-diagnostics
          path: ${{ env.OMD_DESKTOP_SOURCE }}/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 7
