name: Offline plugin installation

on:
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node --test --test-concurrency=1 test/offline.test.mjs test/offline-install.test.mjs test/offline-root.test.mjs
        env:
          OMD_OFFLINE_ARTIFACTS: ${{ runner.temp }}/offline-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: oh-my-dsh-offline-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/offline-artifacts
          include-hidden-files: true
          if-no-files-found: error
