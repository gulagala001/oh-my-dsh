name: CI

on:
  pull_request:
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      layout:
        description: Run Chromium layout checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: node scripts/prepare-host-sdk.mjs
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-public-files.mjs
      - run: pnpm build
      - name: Run maintained regressions once against this build
        run: node scripts/test-ci.mjs run core --built
      - name: Select affected browser checks
        id: layout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_LAYOUT: ${{ inputs.layout }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const changed = process.env.BASE_SHA
            ? execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, 'HEAD'], { encoding: 'utf8' }).split('\n') : [];
          const relevant = /^(?:src\/client\/|plugins\/glyph-theme\/src\/|vendor\/dsh(?:\/|\.json)|scripts\/(?:chat-style-adapter|build-host)\.mjs|test\/process-header-layout\.test\.mjs|pnpm-lock\.yaml|\.github\/workflows\/ci\.yml)/;
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${process.env.FORCE_LAYOUT === 'true' || changed.some(file => relevant.test(file))}\n`);
          NODE
      - name: Native process header layout
        if: steps.layout.outputs.run == 'true'
        run: |
          pnpm exec playwright install --with-deps chromium
          node --test test/process-header-layout.test.mjs
      - name: Verify rebuilt client and actual OpenCU package delivery
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdtempSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          import { nativePackageModes } from './scripts/native-package-modes.mjs';
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'omd-delivery-'));
          appendFileSync(process.env.GITHUB_ENV, `OMD_DELIVERY_ROOT=${root}\n`);
          const packed = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', root], { encoding: 'utf8' }));
          if (packed.length !== 1) throw Error('Expected exactly one final OMD archive');
          const archive = join(root, packed[0].filename);
          const sha256 = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const rawSha256 = sha256(archive);
          await nativePackageModes(archive);
          const evidence = { rawSha256, archive, sha256: sha256(archive) };
          writeFileSync(join(root, 'package-evidence.json'), JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          execFileSync(process.execPath, ['scripts/check-opencu-delivery.mjs', archive], { stdio: 'inherit' });
          execFileSync(process.execPath, ['--test', 'test/opencu-static-zip-delivery.test.mjs'], { stdio: 'inherit', env: { ...process.env, OMD_DELIVERY_ARCHIVE: archive } });
          NODE
      - uses: actions/upload-artifact@v7
        if: always() && env.OMD_DELIVERY_ROOT != ''
        with:
          name: core-opencu-delivery
          path: ${{ env.OMD_DELIVERY_ROOT }}
          if-no-files-found: warn
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the SDK lock and hashed source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: node scripts/prepare-host-sdk.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm run prepack
      - name: Run Windows build and runtime regressions
        run: >-
          node --test --test-timeout=60000
          test/monitor-metadata.test.mjs test/monitor-import.test.mjs
          test/monitor-pricing-route.test.mjs test/monitor-overview-cache.test.mjs
          test/opencu-delivery.test.mjs test/opencu-source-sync.test.mjs
          test/permission-presets.test.mjs test/native-session-read.test.mjs
          test/console-dock.test.mjs test/file-context.test.mjs
          test/codegraph-failure.test.mjs test/codegraph-lifecycle.test.mjs
          test/startup-isolation.test.mjs test/projectless-allocation.test.mjs
          test/legacy-identity.test.mjs test/session-plugin-records.test.mjs
      - name: Prepare and verify a relocatable offline plugin
        run: |
          $offline = Join-Path $env:RUNNER_TEMP 'omd-offline'
          node scripts/prepare-offline.mjs $offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $moved = Join-Path $env:RUNNER_TEMP 'omd-offline-moved'
          Move-Item -LiteralPath $offline -Destination $moved
          & (Join-Path $moved 'check-offline.cmd')
          exit $LASTEXITCODE
