name: CI

on:
  push:
    branches: ['main']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Node 22's serial browser suite takes longer than Node 24's; Windows also
    # needs more time for browser installation. Individual test timeouts remain.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || matrix.node == '22.19.0' && 25 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Real browser fixtures are resource intensive and some exercise the
      # shared desktop. Keep platform results independent and run files in order.
      - run: node --test --test-concurrency=1 test/*.test.mjs
