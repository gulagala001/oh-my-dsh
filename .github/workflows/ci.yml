name: CI

on:
  pull_request:
    paths-ignore: ['README*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      layout:
        description: Run Chromium layout checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-public-files.mjs
      - run: pnpm build
      - name: Run maintained regressions once against this build
        run: node scripts/test-ci.mjs run core --built
      - name: Select affected browser checks
        id: layout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_LAYOUT: ${{ inputs.layout }}
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const changed = process.env.BASE_SHA
            ? execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, 'HEAD'], { encoding: 'utf8' }).split('\n') : [];
          const relevant = /^(?:src\/client\/|plugins\/glyph-theme\/src\/|vendor\/dsh(?:\/|\.json)|scripts\/(?:chat-style-adapter|build-host)\.mjs|test\/process-header-layout\.test\.mjs|pnpm-lock\.yaml|\.github\/workflows\/ci\.yml)/;
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${process.env.FORCE_LAYOUT === 'true' || changed.some(file => relevant.test(file))}\n`);
          NODE
      - name: Native process header layout
        if: steps.layout.outputs.run == 'true'
        run: |
          pnpm exec playwright install --with-deps chromium
          node --test test/process-header-layout.test.mjs
      - name: Verify rebuilt client and actual OpenCU package delivery
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdtempSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          import { nativePackageModes } from './scripts/native-package-modes.mjs';
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'omd-delivery-'));
          appendFileSync(process.env.GITHUB_ENV, `OMD_DELIVERY_ROOT=${root}\n`);
          const packed = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', root], { encoding: 'utf8' }));
          if (packed.length !== 1) throw Error('Expected exactly one final OMD archive');
          const archive = join(root, packed[0].filename);
          const sha256 = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const rawSha256 = sha256(archive);
          await nativePackageModes(archive);
          const evidence = { rawSha256, archive, sha256: sha256(archive) };
          writeFileSync(join(root, 'package-evidence.json'), JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          execFileSync(process.execPath, ['scripts/check-opencu-delivery.mjs', archive], { stdio: 'inherit' });
          execFileSync(process.execPath, ['--test', 'test/opencu-static-zip-delivery.test.mjs'], { stdio: 'inherit', env: { ...process.env, OMD_DELIVERY_ARCHIVE: archive } });
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-opencu-delivery
          path: ${{ env.OMD_DELIVERY_ROOT }}
          if-no-files-found: warn
