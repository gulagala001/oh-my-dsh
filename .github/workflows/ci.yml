name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Real browser fixtures are resource intensive and some exercise the
      # shared desktop. Keep platform results independent and run files in order.
      - run: node --test --test-concurrency=1 test/*.test.mjs
