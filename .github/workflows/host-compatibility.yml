name: Windows readiness diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - name: Repeat isolated native tool and preview readiness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/windows-readiness-probe | Out-Null
          node --test --test-concurrency=1 test/computer-use-ui.test.mjs *> work/windows-readiness-probe/results.log
          $testExit = $LASTEXITCODE
          Get-Content work/windows-readiness-probe/results.log
          exit $testExit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-readiness-probe
          path: work/windows-readiness-probe/
          retention-days: 7
