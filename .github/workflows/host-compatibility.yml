name: Host compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Original complete input step with diagnostics
        run: node --test --test-concurrency=1 test/host-preferences-ui.test.mjs test/prompt-optimizer-ui.test.mjs test/model-panel-ui.test.mjs test/codex-wallpaper-controls-ui.test.mjs test/computer-use-ui.test.mjs
      - name: Independent wallpaper reopen observations
        if: always() && runner.os == 'macOS'
        run: node --test --test-concurrency=1 test/diagnostic-wallpaper-probe.test.mjs
