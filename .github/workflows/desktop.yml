name: Official Desktop package build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Desktop release eligibility regressions
        run: node --test test/desktop-release-eligibility.test.mjs test/build-opencu-imports.test.mjs test/desktop-host-boot-contract.test.mjs
      - id: release
        name: Check whether this host has official desktop packages
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json')).devDependencies['@deepseek-ai/dsh'];
          const releases = JSON.parse(readFileSync('scripts/desktop-releases.json')).releases;
          if (version !== '0.2.1-rc.2') throw Error('Desktop requires the verified 0.2.1-rc.2 SDK; do not retarget this checkout.');
          const targets = [{ os: 'windows-latest', target: 'win-x64' }, { os: 'macos-latest', target: 'mac-arm64' }];
          const include = targets.filter(({ target }) => Boolean(releases[version]?.[target]));
          if (include.length !== targets.length) throw Error(`Missing verified official Desktop package metadata for DSH ${version}; both targets are required.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `available=${include.length > 0}\nmatrix=${JSON.stringify({ include })}\n`);
          for (const { target } of targets.filter(row => !include.includes(row))) {
            console.log(`::notice::Desktop package build NOT RUN: no verified package for DSH ${version}/${target}.`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Desktop package build **NOT RUN**: DSH ${version}/${target} has no verified official download metadata. 真实桌面使用未由CI验收。\n`);
          }
          NODE
  packaged-desktop:
    needs: release-metadata
    if: needs.release-metadata.outputs.available == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Synthetic Deny contracts with real OpenCU controller and ToolRuntime
        run: node --test test/desktop-deny-contract.test.mjs
      - run: pnpm build
      - name: Reserve fresh inputs inside the new workspace
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, mkdirSync, mkdtempSync, realpathSync } from 'node:fs';
          import { join } from 'node:path';
          const workspace = realpathSync(process.env.GITHUB_WORKSPACE);
          mkdirSync(join(workspace, '.cache'), { recursive: true });
          const root = mkdtempSync(join(workspace, '.cache', 'desktop-build-'));
          appendFileSync(process.env.GITHUB_ENV, `OMD_DESKTOP_TEST_ROOT=${root}\n`);
          NODE
      - run: node scripts/prepare-desktop-test.mjs ${{ matrix.target }}
      - name: Freeze the final archive and wire the official app root
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          npm pack --json --ignore-scripts --pack-destination "$OMD_DESKTOP_TEST_ROOT" > "$OMD_DESKTOP_TEST_ROOT/pack.json"
          node --input-type=module - <<'NODE'
          import { appendFileSync, copyFileSync, readFileSync, realpathSync, statSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          import { nativePackageModes } from './scripts/native-package-modes.mjs';
          const root = process.env.OMD_DESKTOP_TEST_ROOT;
          const packed = JSON.parse(readFileSync(join(root, 'pack.json'), 'utf8'));
          if (packed.length !== 1) throw Error('Expected exactly one final OMD archive');
          const archive = realpathSync(join(root, packed[0].filename));
          // Match the existing production pack-local pipeline before freezing.
          // Keep the raw input for failure analysis; delivery never repairs it.
          const rawArchive = join(root, 'raw-' + packed[0].filename);
          copyFileSync(archive, rawArchive);
          const rawSha256 = createHash('sha256').update(readFileSync(rawArchive)).digest('hex');
          writeFileSync(join(root, 'raw-package.json'), JSON.stringify({ file: rawArchive, sha256: rawSha256 }, null, 2));
          await nativePackageModes(archive);
          const resources = process.env.DESKTOP_TARGET === 'mac-arm64'
            ? join(root, 'mac-app', 'DeepSeek Harness.app', 'Contents', 'Resources')
            : join(root, 'windows-app', 'resources');
          const appRoot = realpathSync(join(resources, 'app.asar'));
          if (!statSync(appRoot).isFile()) throw Error('Official Electron app.asar is missing');
          const sha256 = createHash('sha256').update(readFileSync(archive)).digest('hex');
          appendFileSync(process.env.GITHUB_ENV, `OMD_DESKTOP_APP_ROOT=${appRoot}\nOMD_PLUGIN_ARCHIVE=${archive}\nOMD_PLUGIN_ARCHIVE_SHA256=${sha256}\n`);
          NODE
      - name: Verify the actual frozen Desktop tgz delivery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-opencu-delivery.mjs "$OMD_PLUGIN_ARCHIVE" | tee "$OMD_DESKTOP_TEST_ROOT/opencu-delivery.json"
      - name: Boot official Desktop and verify isolated OMD registration
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/desktop-host-boot.test.mjs | tee "$OMD_DESKTOP_TEST_ROOT/host-boot.tap"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.OMD_DESKTOP_TEST_ROOT;
          const tap = readFileSync(join(root, 'host-boot.tap'), 'utf8');
          for (const [key, expected] of [['tests', 1], ['pass', 1], ['fail', 0], ['cancelled', 0], ['skipped', 0]]) {
            const match = tap.match(new RegExp(`^# ${key} (\\d+)$`, 'm'));
            assert.equal(Number(match?.[1]), expected, `Desktop acceptance count: ${key}`);
          }
          const report = JSON.parse(readFileSync(join(root, 'host-boot-evidence', 'desktop-host-boot.json')));
          assert.equal(report.status, 'passed'); assert.equal(report.executed, 1); assert.equal(report.skipped, 0);
          assert.equal(report.launches.length, 2); assert.equal(report.shutdowns.length, 2);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '官方 rc.2 Desktop：本地 tgz 安装、完整退出重启、真实前端及注册/设置入口验收通过；模型调用 0，三个外部 CU backend 关闭且未执行 CU 动作（DSH 自有 browser 适配仍存在）。\n#54 rc.1 配对与 #64 真实 native/CU 动作仍未验收，不得据此关闭。详见脱敏截图和 JSON/TAP。\n');
          NODE
      - name: Real Agent and REA Deny against one synthetic target
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/desktop-deny.test.mjs | tee "$OMD_DESKTOP_TEST_ROOT/deny.tap"
          node --input-type=module - <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { assertDenyReport } from './test/fixtures/desktop-deny/gate.mjs';
          const root = process.env.OMD_DESKTOP_TEST_ROOT;
          const tap = readFileSync(join(root, 'deny.tap'), 'utf8');
          const report = JSON.parse(readFileSync(join(root, 'deny-evidence', 'desktop-deny.json')));
          assertDenyReport(tap, report);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Issue #64 partial: official rc.2 Electron, full frozen OMD, real Agent/ToolRuntime/OpenCU and REA Deny passed against one synthetic target. Two loopback model requests, one tool call, zero rejected/external model routes and zero physical backend operations. Original zero-model host boot remains separate. Physical CU, Allow/grants, Web/WSL export and rc.1 pairing are unverified.\n');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ env.OMD_PLUGIN_ARCHIVE }}
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/pack.json
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/raw-*.tgz
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/raw-package.json
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/host-boot.tap
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/deny.tap
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/deny-evidence/
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/opencu-delivery.json
            ${{ env.OMD_DESKTOP_TEST_ROOT }}/host-boot-evidence/
          if-no-files-found: warn
