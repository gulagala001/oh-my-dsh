name: Official Desktop installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        name: Check whether this host has official desktop packages
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json')).devDependencies['@deepseek-ai/dsh'];
          const releases = JSON.parse(readFileSync('scripts/desktop-releases.json')).releases;
          const available = ['mac-arm64', 'win-x64'].every(target => Boolean(releases[version]?.[target]));
          appendFileSync(process.env.GITHUB_OUTPUT, `available=${available}\n`);
          if (!available) {
            console.log(`::notice::Official desktop verification skipped: no verified packages for DSH ${version}.`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Official desktop installation was **not run**: DSH ${version} has no verified mac-arm64/win-x64 download metadata. Web and source-host compatibility are tested separately.\n`);
          }
          NODE
  packaged-desktop:
    needs: release-metadata
    if: needs.release-metadata.outputs.available == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: macos-latest
            target: mac-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Migration and runtime regression checks
        run: node --test --test-concurrency=1 test/session-migration.test.mjs test/neutral-environment-native.test.mjs test/steering-operations-ui.test.mjs test/skin-components-ui.test.mjs test/ios-liquid-glass-ui.test.mjs
      - run: node scripts/prepare-desktop-test.mjs ${{ matrix.target }}
        env:
          OMD_DESKTOP_TEST_ROOT: ${{ runner.temp }}/omd-desktop
      - run: node --test test/desktop-install.test.mjs
        env:
          TRISOUL_UI_ARTIFACTS: ${{ runner.temp }}/omd-desktop-artifacts
      - name: Native appearance persistence
        run: node --test --test-concurrency=1 --test-name-pattern="appearance commits|Codex desktop layout" test/skin-ui.test.mjs test/codex-desktop-ui.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/omd-desktop-artifacts
          if-no-files-found: warn
