name: Synchronize final compatibility fix
on:
  push:
    branches: ['completion/alpha2']
    paths: ['.github/workflows/sync-completion.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: omd
      - uses: actions/checkout@v7
        with:
          repository: gulagala001/opencu
          ref: 13813e9269e3b7c87778fd1aa937fc47ff0e2349
          path: cu
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate and replace the unmodified release snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,tarfile
          root=Path.cwd();omd=root/'omd';cu=root/'cu';out=Path(os.environ['RUNNER_TEMP'])/'final-opencu-pack';out.mkdir(exist_ok=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=cu,text=True).strip();assert commit=='13813e9269e3b7c87778fd1aa937fc47ff0e2349'
          receipt=json.loads((omd/'vendor/opencu.json').read_text());target=omd/'vendor/opencu'
          for name,digest in receipt['files'].items():assert hashlib.sha256((target/name).read_bytes()).hexdigest()==digest
          assert not any(p.is_symlink() for p in target.rglob('*'))
          packed=json.loads(subprocess.check_output(['npm','pack','--ignore-scripts','--json','--pack-destination',str(out)],cwd=cu,text=True))[0]
          archive=out/packed['filename'];files={}
          with tarfile.open(archive) as tar:
              for m in tar:
                  parts=Path(m.name).parts;assert parts[0]=='package' and '..' not in parts and not Path(m.name).is_absolute() and (m.isfile() or m.isdir())
                  if m.isfile():files[str(Path(*parts[1:]))]=(tar.extractfile(m).read(),m.mode&0o777)
          assert set(files)==set(receipt['files']), 'This compatibility fix must not remove any packaged capability'
          package=json.loads(files['package.json'][0]);own=json.loads((omd/'package.json').read_text())
          assert package['version']=='1.0.3' and own['version']=='0.1.6-alpha.2.1'
          assert all(own['dependencies'].get(k)==v for k,v in package['dependencies'].items())
          for name,(data,mode) in files.items():
              path=target/name;path.write_bytes(data);path.chmod(mode)
          receipt.update(commit=commit,archiveSha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          receipt['files']={name:hashlib.sha256(data).hexdigest() for name,(data,_) in sorted(files.items())}
          (omd/'vendor/opencu.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          p=omd/'docs/release-0.1.6-alpha.2.1-scope.md';s=p.read_text()
          old='仅在刚创建且仍为 `about:blank` 的目标上使用 `Page.stopLoading`，确认后再发送用户网址。'
          assert old in s
          s=s.replace(old,'仅在刚创建且仍为 `about:blank` 的目标上使用 `Page.stopLoading`，随后完成该空白文档的实际加载，再单次发送用户网址；用户请求本身就是空白页时也只导航一次。',1)
          p.write_text(s)
          (omd/'.github/workflows/sync-completion.yml').unlink()
          print('Exact runtime snapshot verified:',commit,len(files),'files')
          PY
      - name: Verify installed file identities and commit
        working-directory: omd
        run: |
          node --test test/opencu-distribution.test.mjs
          git diff --check
          git add vendor/opencu vendor/opencu.json docs/release-0.1.6-alpha.2.1-scope.md .github/workflows/sync-completion.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: integrate final initial-document compatibility without changing other features'
          git push origin HEAD:completion/alpha2
