name: Synchronize completion candidate
on:
  push:
    branches: ['completion/alpha2']
    paths: ['.github/workflows/sync-completion.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: omd
      - uses: actions/checkout@v7
        with:
          repository: gulagala001/opencu
          ref: 9dfcb03460fb782f53645c1e3fa0996847e9eeed
          path: cu
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and verify one unmodified upstream release snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,tarfile
          root=Path.cwd(); omd=root/'omd'; cu=root/'cu'; output=Path(os.environ['RUNNER_TEMP'])/'omd-release-pack'
          output.mkdir(exist_ok=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=cu,text=True).strip()
          assert commit=='9dfcb03460fb782f53645c1e3fa0996847e9eeed'
          packed=json.loads(subprocess.check_output(['npm','pack','--ignore-scripts','--json','--pack-destination',str(output)],cwd=cu,text=True))[0]
          archive=output/packed['filename']; target=omd/'vendor/opencu'
          receipt=json.loads((omd/'vendor/opencu.json').read_text())
          actual={str(p.relative_to(target)) for p in target.rglob('*') if p.is_file()}
          assert actual==set(receipt['files']) and not any(p.is_symlink() for p in target.rglob('*'))
          for name,digest in receipt['files'].items(): assert hashlib.sha256((target/name).read_bytes()).hexdigest()==digest
          files={}
          with tarfile.open(archive) as tar:
              for member in tar:
                  parts=Path(member.name).parts
                  assert parts[0]=='package' and '..' not in parts and not Path(member.name).is_absolute()
                  assert member.isdir() or member.isfile()
                  if member.isdir(): continue
                  name=str(Path(*parts[1:]))
                  assert Path(name).name not in {'AGENTS.md','COMPUTER_USE_HANDOFF.md','COMPUTER_USE_BASELINE.md','PROMPT_CHANGES.md','WINDOWS_HANDOFF.md','.env','.credentials.yaml'}
                  files[name]=(tar.extractfile(member).read(),member.mode&0o777)
          package=json.loads(files['package.json'][0]); own=json.loads((omd/'package.json').read_text())
          assert package['version']=='1.0.3' and own['version']=='0.1.6-alpha.2.1'
          assert all(own['dependencies'].get(k)==v for k,v in package['dependencies'].items())
          for name in actual-set(files): (target/name).unlink()
          for name,(data,mode) in files.items():
              path=target/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);path.chmod(mode)
          receipt.update(commit=commit,version=package['version'],archiveSha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          receipt['files']={name:hashlib.sha256(data).hexdigest() for name,(data,_) in sorted(files.items())}
          (omd/'vendor/opencu.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          (omd/'.github/workflows/sync-completion.yml').unlink()
          print('Verified standalone/integrated equality:',commit,len(files),'files')
          PY
      - name: Validate and commit the synchronized snapshot
        working-directory: omd
        run: |
          node --test test/opencu-distribution.test.mjs
          git diff --check
          git add vendor/opencu vendor/opencu.json .github/workflows/sync-completion.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: integrate the verified OpenCU initial-navigation hardening'
          git push origin HEAD:completion/alpha2
