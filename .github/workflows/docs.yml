name: Documentation

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built documentation to GitHub Pages
        type: boolean
        default: false
  push:
    branches: ['main']
    paths: ['README*.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'THIRD_PARTY_NOTICES.md', 'docs/**', 'package.json', 'pnpm-lock.yaml', 'vendor/opencu.json', 'vendor/dsh.json', 'vendor/dsh/ui-chat.json', 'scripts/check-public-files.mjs', 'scripts/build-docs.mjs', 'scripts/check-docs.mjs', 'scripts/build-credits.mjs', 'src/project*.json', 'src/recommended-plugin-catalog.mjs', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md', 'LICENSE', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README*.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'THIRD_PARTY_NOTICES.md', 'docs/**', 'package.json', 'pnpm-lock.yaml', 'vendor/opencu.json', 'vendor/dsh.json', 'vendor/dsh/ui-chat.json', 'scripts/check-public-files.mjs', 'scripts/build-docs.mjs', 'scripts/check-docs.mjs', 'scripts/build-credits.mjs', 'src/project*.json', 'src/recommended-plugin-catalog.mjs', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md', 'LICENSE', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      # CI skips README/docs-only PRs; check public files before building or deploying docs.
      - run: node scripts/check-public-files.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - name: Build documentation with the runner's existing Chrome
        run: |
          browser=$(command -v google-chrome)
          OMD_DOCS_CHROMIUM="$browser" pnpm docs:build
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
